name: Publier iPad Mural, meteo et Bring chiffre

on:
  push:
    branches: [main]
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ipad-mural
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recuperer les fichiers publics
        uses: actions/checkout@v4
      - name: Installer la version fixe de SJCL
        run: |
          npm install --no-save --ignore-scripts --no-audit sjcl@1.0.9
          test -s node_modules/sjcl/sjcl.js
      - name: Preparer le site
        run: |
          mkdir -p _site
          cp index.html demo-paysage-1.jpg demo-paysage-2.jpg _site/
          cp node_modules/sjcl/sjcl.js _site/sjcl.js
          touch _site/.nojekyll
      - name: Recuperer la meteo Open-Meteo
        run: python3 actualiser_meteo.py _site/weather.json
      - name: Verifier la configuration Bring (sans afficher les valeurs)
        env:
          BRING_EMAIL: ${{ secrets.BRING_EMAIL }}
          BRING_PASSWORD: ${{ secrets.BRING_PASSWORD }}
          BRING_LIST_NAME: ${{ secrets.BRING_LIST_NAME }}
          BRING_VIEW_KEY: ${{ secrets.BRING_VIEW_KEY }}
        shell: bash
        run: |
          failed=0
          for name in BRING_EMAIL BRING_PASSWORD BRING_LIST_NAME BRING_VIEW_KEY; do
            if [ -z "${!name}" ]; then
              echo "ERREUR : secret $name absent ou vide."
              failed=1
            else
              echo "OK : secret $name defini."
            fi
          done
          if [ "${#BRING_VIEW_KEY}" -lt 20 ]; then
            echo "ERREUR : BRING_VIEW_KEY doit avoir au moins 20 caracteres."
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "Echec de la configuration Bring : deploiement conserve dans son ancienne version."
            exit 1
          fi
      - name: Installer l'API Bring
        run: python3 -m pip install --quiet bring-api==1.1.2
      - name: Recuperer et chiffrer la liste Bring
        env:
          BRING_EMAIL: ${{ secrets.BRING_EMAIL }}
          BRING_PASSWORD: ${{ secrets.BRING_PASSWORD }}
          BRING_LIST_NAME: ${{ secrets.BRING_LIST_NAME }}
          BRING_VIEW_KEY: ${{ secrets.BRING_VIEW_KEY }}
        shell: bash
        run: |
          mkdir -p _private
          trap 'rm -f _private/bring.json' EXIT
          python3 synchroniser_bring.py _private/bring.json
          test -s _private/bring.json || { echo 'ERREUR : donnees Bring indisponibles'; exit 1; }
          node chiffrer_bring.js _private/bring.json _site/bring.enc.json
          test -s _site/bring.enc.json || { echo 'ERREUR : bring.enc.json non produit'; exit 1; }
          python3 - <<'CHECK_JSON'
          import json
          from pathlib import Path
          data=json.loads(Path('_site/bring.enc.json').read_text(encoding='utf-8'))
          assert isinstance(data,dict) and data.get('ct') and data.get('iv') and data.get('salt'), 'Format de chiffrement invalide'
          print('OK : bring.enc.json chiffre, valide, inclus dans le deploiement.')
          CHECK_JSON
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publier les fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
